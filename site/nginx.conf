server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # Not in search results until launch (also the robots meta tag in the pages).
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src https://api.github.com; frame-ancestors 'none'" always;

  # What the desktop app updates from (written by the Site workflow).
  location = /latest.json { expires 5m; }
  location = /icon.png { expires 7d; }
  location /img/ { expires 30d; }
  location / {
    try_files $uri $uri.html $uri/ =404;
    expires 10m;
  }
}
