name: winnow
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  connectivity_plus: ^6.1.4
  crypto: ^3.0.6
  dartssh2: ^2.13.0
  exif: ^3.3.0
  file_picker: ^13.4.1
  flutter:
    sdk: flutter
  fvp: ^0.40.0
  http: ^1.6.0
  http_parser: ^4.1.2
  in_app_purchase: ^3.3.1
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  photo_manager: ^3.12.0
  photo_manager_image_provider: ^2.2.0
  sqflite: ^2.4.6
  sqflite_common_ffi: ^2.4.7
  video_player: ^2.14.1
  winnow_native:
    path: packages/winnow_native
  workmanager: ^0.10.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# App icon: `flutter pub run flutter_launcher_icons` regenerates the Android/iOS/macOS/Windows icons from assets/icon.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#0B0B0F"
  adaptive_icon_foreground: assets/icon/foreground.png
  # Themed (single-colour) icons on Android 13+, used by Niagara and Pixel themed icons.
  adaptive_icon_monochrome: assets/icon/monochrome.png
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: assets/icon/icon.png
  windows:
    generate: true
    image_path: assets/icon/icon.png
    icon_size: 256
