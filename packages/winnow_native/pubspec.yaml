name: winnow_native
description: "Winnow's native bits. Android: media management, Google authorization (also in background uploads). macOS: photo metadata, thumbnails, Trash."
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: net.jamespate.winnow_native
        pluginClass: WinnowNativePlugin
      macos:
        pluginClass: WinnowNativePlugin
