name: Android

# Push to main or flutter: debug APK ("Winnow dev", installs next to the release) as a workflow artifact.
# Tag v*: signed release APK attached to a GitHub release, which Obtainium installs and updates.
on:
  push:
    branches: [main, flutter]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Version
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            name="${GITHUB_REF_NAME#v}"
            IFS=. read -r major minor patch <<< "$name"
            code=$(( major * 10000 + minor * 100 + patch ))
          else
            name="0.0.0-dev.${GITHUB_RUN_NUMBER}"
            code=$GITHUB_RUN_NUMBER
          fi
          echo "WINNOW_VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "WINNOW_VERSION_CODE=$code" >> "$GITHUB_ENV"

      - run: flutter pub get
      - run: flutter analyze

      - name: Debug APK
        if: github.ref_type != 'tag'
        run: >
          flutter build apk --debug --build-name "$WINNOW_VERSION_NAME" --build-number "$WINNOW_VERSION_CODE"
          --dart-define WINNOW_VERSION="$WINNOW_VERSION_NAME"
          --dart-define ONEDRIVE_CLIENT_ID="${{ vars.ONEDRIVE_CLIENT_ID }}" --dart-define DROPBOX_APP_KEY="${{ vars.DROPBOX_APP_KEY }}"

      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: winnow-dev-${{ env.WINNOW_VERSION_CODE }}
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Release APK
        if: github.ref_type == 'tag'
        env:
          WINNOW_KEYSTORE_BASE64: ${{ secrets.WINNOW_KEYSTORE_BASE64 }}
          WINNOW_KEYSTORE_PASSWORD: ${{ secrets.WINNOW_KEYSTORE_PASSWORD }}
          WINNOW_KEY_ALIAS: ${{ secrets.WINNOW_KEY_ALIAS }}
        run: |
          export WINNOW_KEYSTORE_FILE="$RUNNER_TEMP/winnow.jks"
          echo "$WINNOW_KEYSTORE_BASE64" | base64 -d > "$WINNOW_KEYSTORE_FILE"
          flutter build apk --release --build-name "$WINNOW_VERSION_NAME" --build-number "$WINNOW_VERSION_CODE" \
            --dart-define WINNOW_VERSION="$WINNOW_VERSION_NAME" \
            --dart-define ONEDRIVE_CLIENT_ID="${{ vars.ONEDRIVE_CLIENT_ID }}" --dart-define DROPBOX_APP_KEY="${{ vars.DROPBOX_APP_KEY }}"
          mv build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/winnow-$WINNOW_VERSION_NAME.apk"
          # The same build as an app bundle, for the Play Store (signed with the same key, the upload key there).
          flutter build appbundle --release --build-name "$WINNOW_VERSION_NAME" --build-number "$WINNOW_VERSION_CODE" \
            --dart-define WINNOW_VERSION="$WINNOW_VERSION_NAME" \
            --dart-define ONEDRIVE_CLIENT_ID="${{ vars.ONEDRIVE_CLIENT_ID }}" --dart-define DROPBOX_APP_KEY="${{ vars.DROPBOX_APP_KEY }}"
          mv build/app/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/winnow-$WINNOW_VERSION_NAME.aab"

      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: |
            ${{ runner.temp }}/winnow-${{ env.WINNOW_VERSION_NAME }}.apk
            ${{ runner.temp }}/winnow-${{ env.WINNOW_VERSION_NAME }}.aab
          generate_release_notes: true
