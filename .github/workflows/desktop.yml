name: Desktop

# Mac, Windows, Linux and iPhone builds. Push to main: zips as workflow artifacts. Tag v*: attached to the GitHub
# release. The Mac job first runs integration_test/desktop_test.dart against real sample files (HEIC, EXIF, video),
# and the iPhone job integration_test/apple_test.dart on a simulator with photo access granted, since the native Apple
# code can't be exercised anywhere else. The iPhone build is unsigned (sideload with AltStore or Sideloadly, which
# sign it with your Apple ID).
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Version
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            name="${GITHUB_REF_NAME#v}"
            IFS=. read -r major minor patch <<< "$name"
            code=$(( major * 10000 + minor * 100 + patch ))
          else
            name="0.0.0-dev.${GITHUB_RUN_NUMBER}"
            code=$GITHUB_RUN_NUMBER
          fi
          echo "WINNOW_VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "WINNOW_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "DEFINES=--build-name $name --build-number $code --dart-define WINNOW_VERSION=$name --dart-define ONEDRIVE_CLIENT_ID=${{ vars.ONEDRIVE_CLIENT_ID }} --dart-define DROPBOX_APP_KEY=${{ vars.DROPBOX_APP_KEY }}" >> "$GITHUB_ENV"

      - run: flutter pub get

      - name: Mac samples
        if: runner.os == 'macOS'
        run: |
          brew install exiftool ffmpeg >/dev/null
          s="$RUNNER_TEMP/samples"; mkdir -p "$s"
          ffmpeg -loglevel error -f lavfi -i "testsrc=size=4000x3000" -frames:v 1 "$s/photo.jpg"
          exiftool -q -overwrite_original "-DateTimeOriginal=2024:10:05 12:34:56" "$s/photo.jpg"
          sips -s format heic "$s/photo.jpg" --out "$s/photo.heic" >/dev/null
          exiftool -q -overwrite_original "-DateTimeOriginal=2024:10:05 12:34:56" "$s/photo.heic"
          ffmpeg -loglevel error -f lavfi -i "testsrc=size=640x360:rate=30:duration=3" -c:v libx264 -pix_fmt yuv420p "$s/clip.mp4"
          cp "$s/photo.jpg" "$s/.hidden.jpg"
          echo "SAMPLES=$s" >> "$GITHUB_ENV"

      - name: Mac integration test
        if: runner.os == 'macOS'
        run: flutter test integration_test/desktop_test.dart -d macos --dart-define SAMPLES="$SAMPLES"

      - name: Build
        run: |
          case "$RUNNER_OS" in
            macOS)
              flutter build macos --release $DEFINES
              ditto -c -k --keepParent build/macos/Build/Products/Release/Winnow.app "$RUNNER_TEMP/winnow-$WINNOW_VERSION_NAME-mac.zip" ;;
            Windows)
              flutter build windows --release $DEFINES
              (cd build/windows/x64/runner/Release && 7z a -bd "$RUNNER_TEMP/winnow-$WINNOW_VERSION_NAME-windows.zip" . >/dev/null) ;;
            Linux)
              flutter build linux --release $DEFINES
              tar -C build/linux/x64/release/bundle -czf "$RUNNER_TEMP/winnow-$WINNOW_VERSION_NAME-linux.tar.gz" . ;;
          esac

      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: winnow-${{ runner.os }}-${{ env.WINNOW_VERSION_CODE }}
          path: ${{ runner.temp }}/winnow-*

      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: ${{ runner.temp }}/winnow-*

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Version
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            name="${GITHUB_REF_NAME#v}"
            IFS=. read -r major minor patch <<< "$name"
            code=$(( major * 10000 + minor * 100 + patch ))
          else
            name="0.0.0-dev.${GITHUB_RUN_NUMBER}"
            code=$GITHUB_RUN_NUMBER
          fi
          echo "WINNOW_VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "WINNOW_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "DEFINES=--build-name $name --build-number $code --dart-define WINNOW_VERSION=$name --dart-define ONEDRIVE_CLIENT_ID=${{ vars.ONEDRIVE_CLIENT_ID }} --dart-define DROPBOX_APP_KEY=${{ vars.DROPBOX_APP_KEY }}" >> "$GITHUB_ENV"

      - run: flutter pub get

      - name: Simulator with sample media and photo access
        run: |
          sim=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$sim"
          xcrun simctl bootstatus "$sim" -b
          brew install ffmpeg >/dev/null
          s="$RUNNER_TEMP/samples"; mkdir -p "$s"
          ffmpeg -loglevel error -f lavfi -i "testsrc=size=1600x1200" -frames:v 1 "$s/winnow-ci.jpg"
          ffmpeg -loglevel error -f lavfi -i "testsrc=size=640x360:rate=30:duration=2" -c:v libx264 -pix_fmt yuv420p "$s/winnow-ci.mp4"
          xcrun simctl addmedia "$sim" "$s/winnow-ci.jpg" "$s/winnow-ci.mp4"
          # A grant only sticks once the app is installed (the test run installs over it, keeping the grant).
          flutter build ios --simulator --debug
          xcrun simctl install "$sim" build/ios/iphonesimulator/Runner.app
          xcrun simctl privacy "$sim" grant photos net.jamespate.winnow
          echo "SIM=$sim" >> "$GITHUB_ENV"

      - name: iPhone integration test
        run: flutter test integration_test/apple_test.dart -d "$SIM"

      - name: Build (unsigned)
        run: |
          flutter build ios --release --no-codesign $DEFINES
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R build/ios/iphoneos/Runner.app "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qr "$RUNNER_TEMP/winnow-$WINNOW_VERSION_NAME-ios-unsigned.ipa" Payload)

      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: winnow-iOS-${{ env.WINNOW_VERSION_CODE }}
          path: ${{ runner.temp }}/winnow-*.ipa

      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: ${{ runner.temp }}/winnow-*.ipa
